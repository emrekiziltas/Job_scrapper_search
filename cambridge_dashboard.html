<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambridge Jobs Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    font-family: 'DejaVu Sans', Arial, sans-serif;
    color: #eaeaea;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .header {
    text-align: center;
    padding: 18px 20px 8px;
    border-bottom: 1px solid #0f3460;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #eaeaea;
    letter-spacing: 0.3px;
  }
  .header .subtitle {
    font-size: 12px;
    color: #a0aec0;
    margin-top: 4px;
  }
  .kpi-strip {
    display: flex;
    gap: 10px;
    padding: 12px 20px;
    background: #1a1a2e;
    border-bottom: 1px solid #0f3460;
    flex-shrink: 0;
  }
  .kpi-card {
    flex: 1;
    background: #1e2a45;
    border: 1.5px solid;
    border-radius: 6px;
    padding: 10px 12px 12px;
    position: relative;
    overflow: hidden;
    min-width: 0;
  }
  .kpi-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 6px 6px 0 0;
  }
  .kpi-value {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.1;
    margin-top: 6px;
  }
  .kpi-label {
    font-size: 11px;
    color: #a0aec0;
    margin-top: 5px;
  }
  
  /* Robust CSS Layout Framework to perfectly coordinate HTML panels with the Plotly Grid */
  .dashboard-container {
    position: relative;
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    padding: 0 40px;
    display: flex;
    flex-direction: column;
  }

  /* Top Overlay Header Panel mapped to Row 2 Grid layout coordinates */
  .row2-headers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    column-gap: 8%; /* Matches Plotly horizontal_spacing precisely */
    width: 100%;
    margin-top: 425px; /* Safely pushes control panel directly over Row 2 */
    position: absolute;
    left: 0;
    padding: 0 40px;
    z-index: 10;
    pointer-events: none; /* Allows chart hovering beneath empty grid columns */
  }

  .grid-header-cell {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1a1a2e;
    padding-bottom: 8px;
    pointer-events: auto; /* Restores interactive behavior on the actual control area */
    flex-wrap: nowrap;
  }

  .table-title {
    font-size: 13px;
    font-weight: bold;
    color: #eaeaea;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-right: 8px;
  }

  .btn-group {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .table-toggle-btn {
    background: #0f3460;
    border: 1px solid #0f3460;
    color: #a0aec0;
    padding: 3px 8px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s ease;
  }

  .table-toggle-btn:hover {
    color: #eaeaea;
    border-color: #e94560;
  }

  .table-toggle-btn.active {
    background: #e94560;
    border-color: #e94560;
    color: #eaeaea;
  }

  .chart-area {
    width: 100%;
    height: 800px;
    z-index: 1;
  }
</style>
</head>

<script>
  function switchTable(mode) {
    var gd = document.querySelector('.plotly-graph-div');
    if (!gd || !window.Plotly) return;
    
    var titleEl = document.getElementById('dynamic-panel-title');
    var btnClosing = document.getElementById('btn-closing');
    var btnRecent = document.getElementById('btn-recent');
    
    if (mode === 'closing') {
      titleEl.innerText = "10 Jobs Closing Soon";
      btnClosing.classList.add('active');
      btnRecent.classList.remove('active');
      window.Plotly.restyle(gd, {'visible': [true, true, true, true, true, false, true]});
    } else {
      titleEl.innerText = "10 Most Recently Posted Jobs";
      btnClosing.classList.remove('active');
      btnRecent.classList.add('active');
      window.Plotly.restyle(gd, {'visible': [true, true, true, true, false, true, true]});
    }
  }

  (function() {
    var gd = document.querySelector('.plotly-graph-div');
    if (!gd) return;
    window.addEventListener('resize', function() {
      if (window.Plotly) {
        window.Plotly.Plots.resize(gd);
      }
    });
  })();
</script>
